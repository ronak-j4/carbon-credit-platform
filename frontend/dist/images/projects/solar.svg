<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="40%" stop-color="#38bdf8"/>
      <stop offset="70%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="hills" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#84cc16"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#sky)"/>
  <circle cx="680" cy="90" r="50" fill="url(#sun)" opacity="0.9"/>
  <circle cx="680" cy="90" r="80" fill="#fef08a" opacity="0.2"/>
  <!-- Mountain ridge -->
  <path d="M0,240 Q200,160 400,220 T800,200 L800,450 L0,450 Z" fill="#65a30d" opacity="0.6"/>
  <path d="M0,260 Q250,190 520,250 T800,230 L800,450 L0,450 Z" fill="url(#hills)"/>
  
  <!-- Solar Arrays Perspective -->
  <g opacity="0.95">
    <!-- Row 1 back -->
    <polygon points="120,290 280,285 270,305 105,310" fill="url(#panel)" stroke="#93c5fd" stroke-width="1"/>
    <polygon points="310,285 470,280 460,300 295,305" fill="url(#panel)" stroke="#93c5fd" stroke-width="1"/>
    <polygon points="500,280 660,275 650,295 485,300" fill="url(#panel)" stroke="#93c5fd" stroke-width="1"/>
    
    <!-- Row 2 mid -->
    <polygon points="90,325 280,318 265,348 70,355" fill="url(#panel)" stroke="#93c5fd" stroke-width="1.5"/>
    <polygon points="310,318 500,312 485,342 290,348" fill="url(#panel)" stroke="#93c5fd" stroke-width="1.5"/>
    <polygon points="530,312 720,305 705,335 510,342" fill="url(#panel)" stroke="#93c5fd" stroke-width="1.5"/>

    <!-- Row 3 foreground -->
    <polygon points="50,375 290,365 270,410 20,420" fill="url(#panel)" stroke="#bae6fd" stroke-width="2"/>
    <polygon points="320,365 560,355 540,400 295,410" fill="url(#panel)" stroke="#bae6fd" stroke-width="2"/>
    <polygon points="590,355 830,345 810,390 565,400" fill="url(#panel)" stroke="#bae6fd" stroke-width="2"/>

    <!-- Grid lines on foreground panel -->
    <line x1="170" y1="370" x2="145" y2="415" stroke="#bae6fd" stroke-width="1.2" opacity="0.7"/>
    <line x1="440" y1="360" x2="417" y2="405" stroke="#bae6fd" stroke-width="1.2" opacity="0.7"/>
    <line x1="710" y1="350" x2="687" y2="395" stroke="#bae6fd" stroke-width="1.2" opacity="0.7"/>
  </g>
  <!-- Solar glare tag -->
  <rect x="24" y="24" width="130" height="30" rx="8" fill="rgba(15,23,42,0.65)"/>
  <text x="36" y="44" fill="#38bdf8" font-family="system-ui, sans-serif" font-weight="700" font-size="12">☀️ SOLAR CLEAN PV</text>
</svg>
