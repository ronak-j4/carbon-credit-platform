<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="forestSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="50%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#dcfce7"/>
    </linearGradient>
    <linearGradient id="treeline1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#14532d"/>
      <stop offset="100%" stop-color="#052e16"/>
    </linearGradient>
    <linearGradient id="treeline2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#forestSky)"/>
  <!-- Mist in canopy -->
  <ellipse cx="400" cy="220" rx="450" ry="80" fill="#ffffff" opacity="0.35"/>
  
  <!-- Distant mountain ridges -->
  <path d="M0,210 Q220,130 450,190 T800,170 L800,450 L0,450 Z" fill="#1e3a2b" opacity="0.5"/>
  <path d="M0,230 Q260,170 540,220 T800,200 L800,450 L0,450 Z" fill="#14532d" opacity="0.7"/>

  <!-- Middle tree canopy silhouettes -->
  <g fill="url(#treeline2)">
    <circle cx="80" cy="280" r="50"/>
    <circle cx="150" cy="270" r="60"/>
    <circle cx="230" cy="285" r="55"/>
    <circle cx="310" cy="265" r="70"/>
    <circle cx="400" cy="275" r="65"/>
    <circle cx="490" cy="260" r="75"/>
    <circle cx="580" cy="280" r="60"/>
    <circle cx="670" cy="265" r="70"/>
    <circle cx="750" cy="280" r="65"/>
    <rect x="0" y="300" width="800" height="150"/>
  </g>

  <!-- Foreground lush trees with sunlight highlights -->
  <g fill="url(#treeline1)">
    <circle cx="40" cy="340" r="85"/>
    <circle cx="160" cy="330" r="95"/>
    <circle cx="290" cy="350" r="90"/>
    <circle cx="440" cy="320" r="110"/>
    <circle cx="590" cy="340" r="100"/>
    <circle cx="730" cy="330" r="105"/>
    <rect x="0" y="380" width="800" height="70"/>
  </g>

  <!-- Sun rays filtering through -->
  <polygon points="400,0 300,450 360,450 430,0" fill="#fef08a" opacity="0.15"/>
  <polygon points="500,0 440,450 510,450 540,0" fill="#fef08a" opacity="0.12"/>
  
  <rect x="24" y="24" width="140" height="30" rx="8" fill="rgba(15,23,42,0.65)"/>
  <text x="36" y="44" fill="#4ade80" font-family="system-ui, sans-serif" font-weight="700" font-size="12">🌲 NATIVE FORESTRY</text>
</svg>
