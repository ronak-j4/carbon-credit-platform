<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bioSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="50%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#f0fdfa"/>
    </linearGradient>
    <linearGradient id="dome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="50%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#134e4a"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#84cc16"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bioSky)"/>
  
  <path d="M0,240 Q300,200 600,230 T800,210 L800,450 L0,450 Z" fill="#4ade80" opacity="0.5"/>
  <path d="M0,270 Q200,220 500,260 T800,240 L800,450 L0,450 Z" fill="url(#grass)"/>

  <!-- Left Digester Dome -->
  <path d="M120,380 C120,270 280,270 280,380 Z" fill="url(#dome)" stroke="#99f6e4" stroke-width="2"/>
  <rect x="110" y="380" width="180" height="25" fill="#334155" rx="4"/>
  <line x1="200" y1="270" x2="200" y2="245" stroke="#94a3b8" stroke-width="3"/>
  <circle cx="200" cy="242" r="5" fill="#2dd4bf"/>

  <!-- Center-Right Large Main Digester Dome -->
  <path d="M330,390 C330,230 570,230 570,390 Z" fill="url(#dome)" stroke="#99f6e4" stroke-width="2.5"/>
  <rect x="315" y="390" width="270" height="30" fill="#1e293b" rx="5"/>
  <line x1="450" y1="235" x2="450" y2="205" stroke="#94a3b8" stroke-width="4"/>
  <circle cx="450" cy="201" r="7" fill="#2dd4bf"/>

  <!-- Connected pipeline -->
  <path d="M280,350 Q305,330 330,350" fill="none" stroke="#64748b" stroke-width="6" stroke-linecap="round"/>

  <!-- Renewable Energy Flare / Cogeneration Tower -->
  <rect x="660" y="270" width="18" height="120" fill="#475569" rx="3"/>
  <!-- Gentle green eco flare indicator -->
  <circle cx="669" cy="255" r="12" fill="#22c55e" opacity="0.7"/>
  <circle cx="669" cy="255" r="6" fill="#fef08a"/>

  <rect x="24" y="24" width="160" height="30" rx="8" fill="rgba(15,23,42,0.65)"/>
  <text x="36" y="44" fill="#2dd4bf" font-family="system-ui, sans-serif" font-weight="700" font-size="12">♻️ BIOMETHANE CAPTURE</text>
</svg>
