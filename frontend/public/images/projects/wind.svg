<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="windSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#ecfeff"/>
    </linearGradient>
    <linearGradient id="windHills" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="50%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#windSky)"/>
  
  <!-- Rolling wind-swept hills -->
  <path d="M0,230 Q250,150 500,220 T800,190 L800,450 L0,450 Z" fill="#86efac" opacity="0.6"/>
  <path d="M0,260 Q180,180 420,240 T800,220 L800,450 L0,450 Z" fill="url(#windHills)"/>

  <!-- Distant Wind Turbine 1 (center-left) -->
  <line x1="260" y1="210" x2="260" y2="130" stroke="#f8fafc" stroke-width="3" stroke-linecap="round"/>
  <circle cx="260" cy="130" r="3.5" fill="#e2e8f0"/>
  <line x1="260" y1="130" x2="260" y2="90" stroke="#f8fafc" stroke-width="2"/>
  <line x1="260" y1="130" x2="295" y2="150" stroke="#f8fafc" stroke-width="2"/>
  <line x1="260" y1="130" x2="225" y2="150" stroke="#f8fafc" stroke-width="2"/>

  <!-- Distant Wind Turbine 2 (right) -->
  <line x1="680" y1="230" x2="680" y2="160" stroke="#f8fafc" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="680" cy="160" r="3" fill="#e2e8f0"/>
  <line x1="680" y1="160" x2="680" y2="125" stroke="#f8fafc" stroke-width="1.8"/>
  <line x1="680" y1="160" x2="710" y2="178" stroke="#f8fafc" stroke-width="1.8"/>
  <line x1="680" y1="160" x2="650" y2="178" stroke="#f8fafc" stroke-width="1.8"/>

  <!-- Prominent Foreground Wind Turbine (Center) -->
  <line x1="460" y1="360" x2="460" y2="140" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
  <circle cx="460" cy="140" r="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
  <!-- 3 Blades -->
  <polygon points="460,140 457,40 463,40" fill="#ffffff"/>
  <polygon points="460,140 545,190 542,196" fill="#ffffff"/>
  <polygon points="460,140 375,190 378,196" fill="#ffffff"/>

  <!-- Wind streaks -->
  <path d="M100,80 Q250,70 400,90" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.4" stroke-dasharray="8 6"/>
  <path d="M300,120 Q480,110 650,130" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.3" stroke-dasharray="10 8"/>

  <rect x="24" y="24" width="130" height="30" rx="8" fill="rgba(15,23,42,0.65)"/>
  <text x="36" y="44" fill="#67e8f9" font-family="system-ui, sans-serif" font-weight="700" font-size="12">💨 RENEWABLE WIND</text>
</svg>
